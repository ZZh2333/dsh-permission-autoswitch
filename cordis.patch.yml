# dsh-permission-autoswitch 的 bundle 补丁层：把插件作为一行插进 profile 的条目列表。
#
#   id:   这一行的唯一标识，主人层可以按 id 覆盖 config（值会被设置页写的 settings.json 盖过）
#   name: 解析到本包入口 lib/index.js（宿主半侧）
#
# config 只是默认值的起点，真正的覆盖有三个层次，后面的赢：
#   包内 DEFAULTS ← 这里的 config ← <DSH_HOME>/storages/permission-autoswitch/settings.json（设置页）

- insert:
    - id: permission-autoswitch
      name: dsh-permission-autoswitch
      config:
        enabled: true
        targetPreset: danger-full-access
        sources:
          - schedule
        dryRun: false
        respectManual: true
        requireFirstMessage: true
        verbose: false
